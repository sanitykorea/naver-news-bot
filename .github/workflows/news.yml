name: naver-news-telegram
on:
  schedule: [{cron: "2-59/5 * * * *"}]   # 매시 정각·5분 단위를 피해 GitHub 부하가 몰리는 시간대를 비껴간다
  workflow_dispatch:
concurrency: {group: news}            # 실행이 겹쳐 중복 발송되는 것 방지
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: seen.json 을 커밋하는 대신 캐시로 넘긴다. 5분 주기면 커밋이 월 8천 건.
      - uses: actions/cache@v4
        with:
          path: |
            seen.json
            state.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python3 bot.py
        env:
          KEYWORDS: ${{ secrets.KEYWORDS }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

      # ponytail: 5분 주기라 계속 실패하면 계속 온다. 시끄러우면 cron 을 늘리거나 실패 카운트를 캐시에 얹을 것.
      - if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_ALERT_CHAT }}" \
            -d disable_web_page_preview=true \
            -d text="⚠️ 뉴스봇 실행 실패
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
