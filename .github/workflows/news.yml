name: naver-news-telegram
on:
  # schedule 일시 중지 — 반복 발송 원인 조사 중. workflow_dispatch로만 수동 실행 가능.
  workflow_dispatch:
    inputs:
      force_digest:
        description: "모아보기 강제 재발송 (현재 슬롯을 다시 flush)"
        type: boolean
        default: false
concurrency: {group: news}            # 실행이 겹쳐 중복 발송되는 것 방지
permissions:
  contents: read
  actions: write   # 캐시 삭제 권한(고정 슬롯 유지에 필요)
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: seen.json 을 커밋하는 대신 캐시로 넘긴다. 5분 주기면 커밋이 월 8천 건.
      #
      # 캐시 전략 히스토리 (두 번 사고 났다, 둘 다 원인이 다르다):
      # 1차 사고: 실행마다(run_id) 새 캐시를 만들어서 2,676개까지 쌓였다 — restore-keys가
      #   엉뚱한(오래된) 스냅샷을 물어와 옛날 기사가 "새 기사"로 재발송됐다.
      # → 고정 키 하나(seen-state)로 바꾸고 저장 전에 매번 지우는 방식으로 수정.
      # 2차 사고: actions/cache는 이미 있는 키로 저장을 못 한다(불변) — "지우고 즉시 저장"
      #   사이의 미세한 타이밍차 때문에 save가 "Cache save failed"로 조용히(스텝은
      #   success로 찍히면서) 계속 실패했고, 그 결과 캐시가 아예 사라진 채로 매 실행이
      #   first_run(=조용히 기록만, 발송 없음)으로 처리돼 11시간 넘게 무발송 사고가 났다.
      # → run_id로 매번 새 키에 저장(절대 충돌 안 남 → save가 실패할 수가 없다)하고,
      #   restore는 seen-state- 접두사로 가장 최근 것을 받아온다. 대신 방치하면 다시
      #   무한정 쌓이니, 저장 성공 후 오래된 슬롯은 최신 것만 남기고 정리한다.
      - uses: actions/cache/restore@v4
        with:
          path: |
            seen.json
            state.json
          key: seen-state-${{ github.run_id }}
          restore-keys: |
            seen-state-
      - run: python3 bot.py
        env:
          FORCE_DIGEST: ${{ inputs.force_digest }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen.json
            state.json
          key: seen-state-${{ github.run_id }}
      - name: 오래된 캐시 슬롯 정리 (최신 것만 남기고 삭제)
        if: always()
        run: |
          set +e
          gh cache list --repo "${{ github.repository }}" --key seen-state- \
            --sort created_at --order desc --json id --limit 100 \
          | jq -r '.[1:][].id' \
          | xargs -r -n1 gh cache delete --repo "${{ github.repository }}"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      # ponytail: 5분 주기라 계속 실패하면 계속 온다. 시끄러우면 cron 을 늘리거나 실패 카운트를 캐시에 얹을 것.
      - if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_ALERT_CHAT }}" \
            -d disable_web_page_preview=true \
            -d text="⚠️ 뉴스봇 실행 실패
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
